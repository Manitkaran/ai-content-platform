[pytest]
# The default suite is GPU-free and never touches the real model: real-model
# tests are marked and deselected here (M0.3, M1.3, M2.4). Run them explicitly
# with: pytest -m real_model
addopts = -q -m "not real_model and not video_integration"
markers =
    real_model: exercises the real faster-whisper driver; needs weights/CPU-GPU (gated out of the default suite)
    video_integration: exercises the real FFmpeg video→audio extraction path; needs the ffmpeg binary but uses the fake transcriber (no GPU/model). Gated out of the default suite; run with: pytest -m video_integration
testpaths = tests
